name: Build desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app.py", "panel_local.html", "agent/**", "main.py", "profile.json", "sources.json", "tests/**", ".github/workflows/build-app.yml"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (on Windows, before anything is built)
        run: python -m unittest discover -s tests -t . -v
      - run: pip install pyinstaller==6.11.1
      - name: Build marker (so a newer copy can recognise an older one still running)
        shell: pwsh
        run: '"${{ github.sha }}".Substring(0, 12) + " " + (Get-Date -Format "yyyy-MM-dd") | Set-Content -NoNewline -Encoding ascii build.txt; Get-Content build.txt'
      - name: Build JobAgent.exe
        run: >
          pyinstaller --onefile --noconsole --name JobAgent --clean
          --add-data "panel_local.html;." --add-data "agent/filler.js;agent" --add-data "profile.json;." --add-data "keys.json;." --add-data "sources.json;." --add-data "build.txt;."
          --hidden-import main --hidden-import agent --hidden-import agent.sources --hidden-import agent.score
          --hidden-import agent.tailor --hidden-import agent.tracker --hidden-import agent.util --hidden-import agent.browser --hidden-import agent.ai --hidden-import agent.details --hidden-import agent.sitebrowse
          app.py
      - name: Check Windows-only parts (password encryption)
        shell: pwsh
        run: |
          python -c "import app; b=app._dpapi(b'secret-123', True); assert app._dpapi(b, False)==b'secret-123'; print('DPAPI ok')"
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\JobAgent.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 8
          $page = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/).Content
          $tok = [regex]::Match($page, 'const TOKEN = "([^"]+)"').Groups[1].Value
          if (-not $tok -or $tok -eq "__JOBAGENT_TOKEN__") { throw "token not written into the page" }
          $r = Invoke-WebRequest -UseBasicParsing -Headers @{ "X-JobAgent-Token" = $tok } http://127.0.0.1:8765/api/status
          if ($r.StatusCode -ne 200) { throw "app did not answer" }
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/status | Out-Null; throw "API answered without token" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw } }
          $csp = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/).Headers["Content-Security-Policy"]
          if ("$csp" -notmatch "script-src 'nonce-") { throw "page is served without its script nonce" }
          try { Invoke-WebRequest -UseBasicParsing -Headers @{ "X-JobAgent-Token" = $tok } "http://127.0.0.1:8765/api/file?path=keys.json" | Out-Null; throw "keys.json was readable" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $k = Invoke-RestMethod -Headers @{ "X-JobAgent-Token" = $tok } http://127.0.0.1:8765/api/keys
          if ($null -eq $k.jooble) { throw "/api/keys did not answer" }
          $s = Invoke-RestMethod -Headers @{ "X-JobAgent-Token" = $tok } http://127.0.0.1:8765/api/status
          if ($s.build -eq "dev" -or -not $s.build) { throw "build marker missing from the exe" }
          # a second copy must not bind the same port (Windows SO_REUSEADDR trap): it opens the running one's page and exits
          $p2 = Start-Process -FilePath dist\JobAgent.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 6
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force; throw "a second copy kept running next to the first" }
          $listeners = (netstat -ano -p TCP | Select-String ":8765 " | Select-String "LISTENING" | Measure-Object).Count
          if ($listeners -ne 1) { throw "expected exactly one listener on 8765, found $listeners" }
          if (-not (Test-Path dist\data\tracker.csv)) { throw "data folder was not created next to the exe" }
          Stop-Process -Id $p.Id -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Job Agent (Windows)
          body: "Put JobAgent.exe in a folder of your choice and double-click. Later versions install themselves from the app (Settings > Program version, or the Update ready button). Your data stays on your PC."
          files: |
            dist/JobAgent.exe
            build.txt
          prerelease: false
