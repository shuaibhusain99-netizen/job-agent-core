name: Build desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app.py", "panel_local.html", "agent/**", "main.py", "profile.json", "sources.json", ".github/workflows/build-app.yml"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1
      - name: Build JobAgent.exe
        run: >
          pyinstaller --onefile --noconsole --name JobAgent --clean
          --add-data "panel_local.html;." --add-data "profile.json;." --add-data "keys.json;." --add-data "sources.json;."
          --hidden-import main --hidden-import agent --hidden-import agent.sources --hidden-import agent.score
          --hidden-import agent.tailor --hidden-import agent.tracker --hidden-import agent.util
          app.py
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\JobAgent.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/status
          if ($r.StatusCode -ne 200) { throw "app did not answer" }
          Stop-Process -Id $p.Id -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Job Agent (Windows)
          body: "Download JobAgent.exe, put it in a folder of your choice, double-click. Data is kept in a `data` folder next to it."
          files: dist/JobAgent.exe
          prerelease: false
