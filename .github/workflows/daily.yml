name: Daily job agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"   # 07:00 Bahrain / Riyadh time, every day

permissions:
  contents: write   # the run commits tracker.csv and application packs back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent
        id: agent
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_TOKEN: ${{ secrets.SHEET_WEBHOOK_TOKEN }}
        run: python main.py | tee run.log
      - name: Commit tracker and application packs
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add tracker.csv applications
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F): ${{ steps.agent.outputs.new }} new, ${{ steps.agent.outputs.apply }} ready to apply"
          git push
      - name: Run summary
        run: |
          echo "## Job agent — $(date -u +%F)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -60 run.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: |
            reports/*.csv
            applications/*.md
          retention-days: 30
